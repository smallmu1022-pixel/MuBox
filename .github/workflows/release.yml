name: Release Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Decode Keystore
        run: |
          base64 -d .github/signing/keystore.enc.b64 | openssl enc -d -aes-256-cbc -pbkdf2 -pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" > ${{ github.workspace }}/release.keystore
          KS_BYTES=$(stat -c%s ${{ github.workspace }}/release.keystore)
          echo "keystore_bytes=${KS_BYTES}"
          if [ "$KS_BYTES" -lt 1000 ]; then echo "ERROR: decoded keystore is too small"; exit 1; fi
      - name: Fetch libbox
        run: |
          if [ ! -f app/libs/libbox.aar ] || [ $(stat -c%s app/libs/libbox.aar) -lt 1000000 ]; then
            gh release download deps-v1.0.0 --repo ${{ github.repository }} --pattern "libbox.aar" --dir app/libs --clobber
          fi
          ls -lh app/libs/libbox.aar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize and grant execute permission for gradlew
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
      - name: Build with Gradle
        run: |
          mkdir -p dist
          ./gradlew assembleRelease -PabiOnly=arm64-v8a
          find app/build/outputs/apk/release -type f -name "*.apk" -exec cp {} dist/ \;
          rm -f app/build/outputs/apk/release/*.apk
          ./gradlew assembleRelease -PabiOnly=armeabi-v7a
          find app/build/outputs/apk/release -type f -name "*.apk" -exec cp {} dist/ \;
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ github.ref_name }}
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
